<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIDEQUEST — PC Game Key &amp; Deal Tracker</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2" />

</head>

  <body>
<header class="top-nav">
  <div class="nav-inner">
    <a class="brand" href="#" onclick="location.reload()">
      <span class="campfire-badge" aria-hidden="true">🔥</span>
      <div>
        <div class="brand-name">SIDEQUEST</div>
        <div class="brand-sub">Every Great Adventure Starts With a Sidequest</div>
      </div>
    </a>

    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search games, keys, or deals... (Ctrl + K)" oninput="renderStorefront()" />
    </div>

    <div class="nav-actions">
      <select id="sellerFilter" onchange="renderStorefront()">
        <option value="all">All Merchants</option>
        <option value="Official Store">Official Stores</option>
        <option value="Key Reseller">Key Resellers</option>
      </select>
      <button class="btn btn-primary" onclick="syncDiscover()">Sync Top Deals</button>
      <button class="btn btn-ghost" id="themeToggleBtn" onclick="toggleRealmTheme()">☀️ Light Mode</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="status-bar">
    <span id="statusText">Connecting to Sidequest deal engine...</span>
    <div class="quick-tools">
      <input type="number" id="appIdInput" placeholder="Steam App ID (e.g. 413150)" />
      <button class="btn btn-secondary" onclick="trackGame()">+ Track Game</button>
      <label class="btn btn-secondary upload-label">
        Import CSV/JSON
        <input type="file" accept=".csv,.json" onchange="uploadResellerFeed(event)" hidden />
      </label>
    </div>
  </div>

  <div class="filter-tabs">
    <button class="tab-btn active" onclick="setTab('all', this)">All Tracked Deals</button>
    <button class="tab-btn" onclick="setTab('sale', this)">On Sale Now</button>
    <button class="tab-btn" onclick="setTab('under20', this)">Under $20</button>
  </div>

  <section id="heroContainer"></section>

  <h2 class="section-heading" id="sectionHeading">FEATURED DEALS</h2>
  <section id="dealsContainer" class="deals-grid"></section>
</main>

<div class="modal-backdrop" id="dealModal" onclick="closeModalOnBackdrop(event)">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>
<script src="app.js?v=3"></script>
</body>
</html>
